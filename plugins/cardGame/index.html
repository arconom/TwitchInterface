class Deck
{
    constructor()
	{
	    this.cards = [];
		this.onShuffleHandlers = [];
		this.onCardAddedHandlers = [];
	}
	
	shuffle()
	{
	    this.cards.sort(function(a,b){return Math.random() * 2 - 1});
		this.onShuffleHandlers.forEach(function(handler){handler();});
	}
	
	drawCards(howMany)
	{
	    let returnMe = [];
		
		for(let i = 0; i < howMany; i++)
		{
	        returnMe.push(this.cards.pop());
		}
		
		return returnMe;
	}
	
	addCards(cards)
	{
	    for(let i = 0; i < cards.length; i++)
		{
            this.cards.push(cards[i]);
		}
        this.onCardAddedHandlers.forEach(function(handler){handler();});
	}
}

class Hand extends Deck
{



}

class ActionHandlerCollection
{
    constructor() {
        this.onDiscarded = [];
        this.onExhausted = [];
        this.onDraw = [];
        this.onTurnStart = [];
        this.onTurnEnd = [];
    }
}

class Card
{
    constructor()
	{
	    this.frontImage = null;
		this.backImage = null;
		this.chargeTime  = 0;
		this.manaCost = 0;
		this.physicalDamageModifier = 0;
		this.magicDamageModifier = 0;
		this.actions = [];
		this.faceup = false;
	}
	
	doActions(player, otherPlayer, gameController)
	{
		this.actions.forEach(function(action){
		    action(this, gameController, player, otherPlayer);
		});
	}

    image()
	{
	    return this.faceup ? this.frontImage : this.backImage;
	}
}


class Player extends ActionHandlerCollection
{
    constructor()
	{
	    super();
	    this.deck = new Deck();
	    this.discard = new Deck();
		this.hand = new Hand();
		this.exhaust = new Deck();
		this.cardsInPlay = [];
		this.cardToResolve = null;
		this.chargeTime = 0;
		this.draftableCards = [];
		this.currentMana = 3;
		this.maxMana = 3;
		this.currentHP = 30;
		this.maxHP = 30;
		this.physicalDefense = 0;
		this.magicDefense = 0;
		this.physicalDamage = 0;
		this.magicDamage = 0;
		this.endTurn = false;
		
		//callbacks
		this.onPhysicalDamageTaken = [];
		this.onMagicDamageTaken = [];
		this.onPhysicalDamageDealt = [];
		this.onMagicDamageDealt = [];
	}

    takePhysicalDamage(amount)
	{
	    let actualDamage = amount - this.physicalDefense;
        this.takeDamage(actualDamage);		
		this.onPhysicalDamageTaken.forEach(function(handler){handler(this, actualDamage)});
	}
    
	takeMagicDamage(amount)
	{
	    let actualDamage = amount - this.magicDefense;
        this.takeDamage(actualDamage);		
		this.onMagicDamageTaken.forEach(function(handler){handler(this, actualDamage)});
	}
	
	takeDamage(amount)
	{
	    this.currentHP -= amount;
		
		if(this.currentHP < 0)
		{
		    this.currentHP = 0;
		}
	}
	
	spendMana(amount)
	{
		if(this.currentMana < amount)
		{
		    return false;
		}
		else
		{
		    this.currentMana -= amount;
		}
	}
	
	increaseChargeTime(amount)
	{
	    this.chargeTime += amount;
	}
	
	decreaseChargeTime(amount)
	{
	    this.chargeTime -= amount;

		if(this.chargeTime < 0)
		{
		    this.chargeTime = 0;
		}
	}
	
	queueCard(index)
	{
		console.log("queueCard");
		//send hand[index] to cards to resolve
		
		
		if(this.currentMana >= this.hand.cards[index].manaCost)
		{
			let card = this.hand.cards.splice(index, 1)[0];
			console.log("card", card);
			this.cardToResolve = (card);
		}
	}
	
	unqueueCard()
	{
		console.log("unqueueCard");

		if(this.cardToResolve !== null)
		{
			this.hand.addCards([this.cardToResolve]);
			this.cardToResolve = null;
		}
	}

	sendToDiscard(card)
	{
		this.discard.addCards([card]);
	}
}

    startTurn()
	{
	    this.turnNumber++;
		this.onTurnStart.forEach(function(handler){
			handler(this);
		});
	}
	
    endTurn(player)
	{
		player.endTurn = true;
	
		if(this.bottomPlayer.endTurn && this.topPlayer.endTurn)
		{
			this.onTurnEnd.forEach(function(handler){
				handler(this); 
			});
		
			this.topPlayer.currentMana = this.topPlayer.maxMana;
			this.topPlayer.chargeTime = Math.floor(Math.random() * 5);
			
			this.bottomPlayer.currentMana = this.bottomPlayer.maxMana;
			this.bottomPlayer.chargeTime = Math.floor(Math.random() * 5);
			
			this.bottomPlayer.endTurn = false;
			this.topPlayer.endTurn = false;
		}
	}

	isBothPlayersReady()
	{
		return this.isTopPlayerReady && this.isBottomPlayerReady;
	}

	toggleTopPlayerReady()
	{
		this.isTopPlayerReady = !this.isTopPlayerReady;

		if(this.isBothPlayersReady())
		{
			this.resolveCards();
		}
	}
	
	toggleBottomPlayerReady()
	{
		this.isBottomPlayerReady = !this.isBottomPlayerReady;

		if(this.isBothPlayersReady())
		{
			this.resolveCards();
		}
	}

	resolveCards()
	{
		console.log("resolveCards");
	    let firstPlayerIndex = this.getFirstPlayerIndex(this.topPlayer, this.bottomPlayer);
		
		if(firstPlayerIndex === 0)
		{
			this.resolveCard(this.topPlayer, this.bottomPlayer, this);
			this.isTopPlayerReady = false;
		}
		else
        {
			this.resolveCard(this.bottomPlayer, this.topPlayer, this);
			this.isBottomPlayerReady = false;
		}
	}
	
	getFirstPlayerIndex(topPlayer, bottomPlayer)
	{
		if(this.topPlayer.chargeTime < this.bottomPlayer.chargeTime)
		{
			return 0;
		}
		else if(this.topPlayer.chargeTime > this.bottomPlayer.chargeTime)
		{
			return 1;
		}
		else
		{
			if(topPlayer.cardsToResolve[0].chargeTime < bottomPlayer.cardsToResolve[0].chargeTime)
			{
				return 0;
			}
			else if(topPlayer.cardsToResolve[0].chargeTime > bottomPlayer.cardsToResolve[0].chargeTime)
			{
				return 1;
			}
			else
			{
			    if(this.lastPlayer === 0)
				{
					return 0;
				}
				else if(this.lastPlayer === 1)
				{
					return 1;
				}
			}
		}
	}
	
	promptSelectCardInPlay(player, callback)
	{
		let self = this;
		this.selectedCard = null;
	
	    if(player === this.bottomPlayer)
		{
			this.isBottomPlayerSelecting = true;
			
			let interval = setInterval(function(){
				if(self.selectedCard !== null)
				{
					callback(self.selectedCard);
					clearInterval(interval);
				}
			},500);
		}
	}

	resolveCard(player, otherPlayer)
	{
		if(player.cardToResolve != null)
		{
		
			player.spendMana(player.cardToResolve.manaCost);
			player.increaseChargeTime(player.cardToResolve.chargeTime);
		
			player.cardToResolve.doActions(player, otherPlayer, this);

			if(player.cardToResolve.type === "Summon" ||
				player.cardToResolve.type === "Equipment")
			{
				player.cardToResolve.faceup = true;
				player.cardsInPlay.push(player.cardToResolve); 
			}
			else
			{
				player.sendToDiscard(player.cardToResolve);
			}
			
			player.cardToResolve = null;
		}
	}
}
